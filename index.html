<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX Community</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div class="brand">MAX<span>•</span></div><button class="secondary">Sign in</button></header>
<main>
<section class="card auth-card">
<h1>Welcome to MAX</h1>
<p class="muted">A community app for people, conversations, calls and AI.</p>
<label>Email</label><input type="email" placeholder="you@example.com">
<label>Password</label><input type="password" placeholder="Password">
<div class="row"><button>Sign in</button><button class="secondary">Create account</button></div>
</section>
<section class="grid">
<aside class="card"><h2>MAX</h2><p class="muted">Home</p><p>💬 Messages</p><p>🤖 AI Assistant</p><p>🔔 Notifications</p><p>📞 Voice & video calls</p></aside>
<section class="card"><h2>Community Feed</h2><textarea placeholder="What's on your mind?"></textarea><button>Post</button><article class="post"><strong>Welcome to MAX</strong><p>Your community space is being built.</p></article></section>
</section>
</main>
</body>
</html>
